image: "git.mesalab.cn:7443/mesa_platform/build-env:master"
variables:
  GIT_STRATEGY: "clone"
  BUILD_PADDING_PREFIX: /tmp/padding_for_CPACK_RPM_BUILD_SOURCE_DIRS_PREFIX_PREFIX_PREFIX_PREFIX_PREFIX_PREFIX/
  INSTALL_PREFIX: "/home/mesasoft/sapp_run/"
  INSTALL_DEPENDENCY_LIBRARY: libunwind gperftools mrzcpd numactl-devel zlib-devel librdkafka-devel systemd-devel libMESA_htable-devel libMESA_prof_load-devel libcjson-devel libMESA_field_stat2-devel  framework_env libwiredcfg-devel libWiredLB-devel libMESA_handle_logger-devel libbreakpad_mini-devel vim-common libMESA_jump_layer-devel libMESA_jump_layer
  SYMBOL_TARGET: sapp

stages:
- build
- envelope
- upload
- test

sapp_module_test:
  stage: test
  script:
    - yum makecache
    - yum install -y net-tools psmisc iproute initscripts gperftools-libs gdb 
    - yum install -y libMESA_htable libMESA_prof_load  libMESA_field_stat2  libMESA_handle_logger libcjson systemd systemd-devel libpcap libpcap-devel libbreakpad_mini libMESA_jump_layer
    - yum install -y sapp gtest_sapp benchmark_pcap
    - ls -l /opt/MESA/lib
    - echo "/opt/MESA/lib" >> /etc/ld.so.conf
    - ldconfig
    - ldd /home/mesasoft/sapp_run/sapp
    - ifconfig
    - sysctl -w net.ipv6.conf.all.disable_ipv6=0
    - ifconfig
    - ip neigh show
    - ip -6 neigh show
    - cd /home/mesasoft/sapp_run
    - ulimit -c 0
    - ./sapp -r /home/mesasoft/benchmark_pcap/tcp/tcp_simple.pcap
    - ./gtest_sapp_v4
  tags:
  - share    

.build_by_travis:
  before_script:
  - mkdir -p $BUILD_PADDING_PREFIX/$CI_PROJECT_NAMESPACE/
  - ln -s $CI_PROJECT_DIR $BUILD_PADDING_PREFIX/$CI_PROJECT_PATH
  - cd $BUILD_PADDING_PREFIX/$CI_PROJECT_PATH
  - chmod +x ./ci/travis.sh
  script:
  - yum makecache
  - ./ci/travis.sh
  - cd build
  tags:
  - share

branch_build_debug:
  stage: build
  extends: .build_by_travis
  variables:
    BUILD_TYPE: Debug
    CAPTURE_MODE: MARSIO
    PLATFORM_MODE: INLINE
  except:
    - /^dev*.*$/i
    - /^rel*.*$/i
    - /^master.*$/i
    - tags

branch_build_release:
  stage: build
  variables:
    BUILD_TYPE: RelWithDebInfo
    CAPTURE_MODE: MARSIO
    PLATFORM_MODE: INLINE
  extends: .build_by_travis
  except:
    - /^dev*.*$/i
    - /^rel*.*$/i
    - /^master.*$/i
    - tags

develop_build_debug:
  stage: build
  extends: .build_by_travis
  variables:
    BUILD_TYPE: Debug
    CAPTURE_MODE: MARSIO
    PLATFORM_MODE: INLINE
    PACKAGE: 1
    UPLOAD: 1
    ASAN_OPTION: ADDRESS
    MEM_POOL: TCMALLOC
    TESTING_VERSION_BUILD: 1
    PULP3_REPO_NAME: platform-testing-x86_64.el7
    PULP3_DIST_NAME: platform-testing-x86_64.el7
  artifacts:
    name: "sapp-$CI_COMMIT_REF_NAME-debug"
    paths:
      - build/*.rpm
  only:
    - /^dev*.*$/i
    - /^rel*.*$/i
    - /^master.*$/i

develop_build_release:
  stage: build
  extends: .build_by_travis
  variables:
    BUILD_TYPE: RelWithDebInfo
    CAPTURE_MODE: MARSIO
    PLATFORM_MODE: INLINE
    PACKAGE: 1
    UPLOAD: 1
    ASAN_OPTION: "OFF"
    MEM_POOL: TCMALLOC
    TESTING_VERSION_BUILD: 1
    PULP3_REPO_NAME: platform-testing-x86_64.el7
    PULP3_DIST_NAME: platform-testing-x86_64.el7
  artifacts:
    name: "sapp-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*.rpm
  only:
    - /^dev*.*$/i
    - /^rel*.*$/i
    - /^master.*$/i


release_build_release:
  stage: build
  variables:
    BUILD_TYPE: RelWithDebInfo
    CAPTURE_MODE: MARSIO
    PLATFORM_MODE: INLINE
    PACKAGE: 1
    UPLOAD: 1
    PULP3_REPO_NAME: platform-stable-x86_64.el7
    PULP3_DIST_NAME: platform-stable-x86_64.el7
  extends: .build_by_travis
  artifacts:
    name: "sapp-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*.rpm
  only:
    - tags   
    
envelope_rpm:
  stage: envelope
  variables:
    FEATURE_ID: 100
    APP_NAME_IN_RPM_SPEC: sapp
  script:
    - export RPM_FULL_PATH=`ls $CI_PROJECT_DIR/build/*.rpm | grep -v debug | grep -v debuginfo | grep -v devel | head -n 1`
    - export | grep RPM_FULL_PATH
    - ls $RPM_FULL_PATH
    - export BIN_TO_PROTECT_IN_RPM="${INSTALL_PREFIX}/sapp"
    - export | grep BIN_TO_PROTECT_IN_RPM
    - /root/rebuildrpm_and_envelope.sh $RPM_FULL_PATH $BIN_TO_PROTECT_IN_RPM $FEATURE_ID $APP_NAME_IN_RPM_SPEC
  tags:
    - envelope
  artifacts:
    name: "sapp-pr-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*-pr-*.rpm
  only:
    - tags
  
upload_envelope_rpm:
  stage: upload
  variables:
    PULP3_REPO_NAME: platform-stable-x86_64.el7
    PULP3_DIST_NAME: platform-stable-x86_64.el7
  script:
    - cd $CI_PROJECT_DIR/build/
    - ls -ahl *.rpm
    - cp ~/rpm_upload_tools.py ./
    - python3 rpm_upload_tools.py ${PULP3_REPO_NAME} ${PULP3_DIST_NAME} *-pr-*.rpm
    - rm -rf *.rpm
  tags:
    - share
  only:
    - tags

