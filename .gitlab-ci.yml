branch_build_debug_for_centos7:
  stage: build
  extends: .build_by_travis_for_centos7
  variables:
    BUILD_TYPE: Debug
    CAPTURE_MODE: MARSIO
    PLATFORM_MODE: INLINE
  artifacts:
    paths:
    - build/src/entry/sapp
    - build/test/libsapp_devel.so  
  except:
    - /^dev*.*$/i
    - /^rel*.*$/i
    - /^master.*$/i
    - tags

branch_build_release_for_centos7:
  stage: build
  variables:
    BUILD_TYPE: RelWithDebInfo
    CAPTURE_MODE: MARSIO
    PLATFORM_MODE: INLINE
  extends: .build_by_travis_for_centos7
  artifacts:
    paths:
    - build/src/entry/sapp
    - build/test/libsapp_devel.so    
  except:
    - /^dev*.*$/i
    - /^rel*.*$/i
    - /^master.*$/i
    - tags

develop_build_debug_for_centos7:
  stage: build
  extends: .build_by_travis_for_centos7
  variables:
    BUILD_TYPE: Debug
    CAPTURE_MODE: MARSIO
    PLATFORM_MODE: INLINE
    PACKAGE: 1
    UPLOAD: 1
    ASAN_OPTION: "OFF"
    TESTING_VERSION_BUILD: 1
    PULP3_REPO_NAME: platform-testing-x86_64.el7
    PULP3_DIST_NAME: platform-testing-x86_64.el7
  artifacts:
    name: "sapp-$CI_COMMIT_REF_NAME-debug"
    paths:
      - build/src/entry/sapp
      - build/test/libsapp_devel.so       
      - build/*.rpm
  only:
    - /^dev*.*$/i
    - /^rel*.*$/i
    - /^master.*$/i

