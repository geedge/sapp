.build_before_script:
  before_script:
    - mkdir -p $BUILD_PADDING_PREFIX/$CI_PROJECT_NAMESPACE/
    - ln -s $CI_PROJECT_DIR $BUILD_PADDING_PREFIX/$CI_PROJECT_PATH
    - cd $BUILD_PADDING_PREFIX/$CI_PROJECT_PATH
    - sed -i 's/\/8\//\/7\//g' /etc/yum.repos.d/repo.internal.geedge.net.repo  
    - yum makecache
    - chmod +x ./ci/travis.sh
    - yum install -y elfutils-libelf-devel

.build_by_travis_for_centos7:
  stage: build
  image: $BUILD_IMAGE_CENTOS7
  extends: .build_before_script
  script:
    - yum install -y libmnl-devel
    - yum install -y libnfnetlink-devel
    - export LIBRARY_PATH=/home/mesasoft/sapp_run/lib/:$LIBRARY_PATH
    - export LD_LIBRARY_PATH=/home/mesasoft/sapp_run/lib/:$LD_LIBRARY_PATH
    - yum makecache
    - ./ci/travis.sh
    - cd build
    - pwd
    - ls
    - find . -name "*sapp_benchmark*"
  tags:
    - share

.build_by_travis_for_centos8:
  stage: build
  image: $BUILD_IMAGE_CENTOS8
  extends: .build_before_script
  script:
    - dnf --enablerepo=powertools install -y libmnl-devel
    - dnf --enablerepo=powertools install -y libnfnetlink-devel
    - export LIBRARY_PATH=/home/mesasoft/sapp_run/lib/:$LIBRARY_PATH
    - export LD_LIBRARY_PATH=/home/mesasoft/sapp_run/lib/:$LD_LIBRARY_PATH
    - yum makecache
    - ./ci/travis.sh
    - cd build
    - pwd
    - ls
    - find . -name "*sapp_benchmark*"
  tags:
    - share

branch_build_debug_for_centos7:
  stage: build
  extends: .build_by_travis_for_centos7
  variables:
    BUILD_TYPE: Debug
    CAPTURE_MODE: MARSIO
    PLATFORM_MODE: INLINE
  except:
    - /^dev*.*$/i
    - /^rel*.*$/i
    - /^master.*$/i
    - tags

branch_build_release_for_centos7:
  stage: build
  variables:
    BUILD_TYPE: RelWithDebInfo

  extends: .build_by_travis_for_centos7
  except:
    - /^dev*.*$/i
    - /^rel*.*$/i
    - /^master.*$/i
    - tags

develop_build_release_for_centos7:
  stage: build
  extends: .build_by_travis_for_centos7
  variables:
    BUILD_TYPE: RelWithDebInfo
    PACKAGE: 1
    UPLOAD: 1
    ASAN_OPTION: "OFF"
    PULP3_REPO_NAME: platform-testing-x86_64.el7
    PULP3_DIST_NAME: platform-testing-x86_64.el7
  artifacts:
    paths:
    - build/example/test_sapp_benchmark
    - build/example/test_benchmark_plug.so
    - build/src/libsapp_benchmark.so
    - build/*.rpm
  only:
    - /^dev*.*$/i
    - /^rel*.*$/i
    - /^master.*$/i

release_build_release_for_centos7:
  stage: build
  variables:
    BUILD_TYPE: RelWithDebInfo
    PACKAGE: 1
    UPLOAD: 1
    PULP3_REPO_NAME: platform-stable-x86_64.el7
    PULP3_DIST_NAME: platform-stable-x86_64.el7
  extends: .build_by_travis_for_centos7
  artifacts:
    paths:
    - build/example/test_sapp_benchmark
    - build/example/test_benchmark_plug.so
    - build/src/libsapp_benchmark.so
    - build/*.rpm
  only:
    - tags   

