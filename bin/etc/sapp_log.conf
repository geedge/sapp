[global]
default format = "%d(%c), %V, %U, %m%n"
[levels]
DEBUG=10
INFO=20
FATAL=30
[formats]
other = "%d(%c), %V, %F, %U, %m%n"
plugin = "%d(%c), %m%n"
[rules]
sapp_log.fatal    "./log/runtimelog.%d(%F)"
sapp_plugin_log.fatal    >stdout; plugin
sapp_plugin_log.info    "./log/plugin.log"; plugin
sapp_process_latency_log.fatal   "./log/sapp_process_latency.log"
!.fatal    "./log/%c.%d(%F)"; other
