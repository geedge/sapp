#用于指定mirror模式下, 注入包忽略哪些协议层, 用于适配捕包点和注入点不在同一个设备上的缺陷
#如镜像流量有vlan, 但注入rst的fd路由器仅支持内层四元组,不能带vlan
#sappv3是用配置文件skip_no_ipo_layer跳过所有ethernet之上的非ip层, 这样就没注入的问题了, 但导致某些JC功能就不对了, 丢失了一些协议信息 
#
#layer name definition:  ipv4, ipv6, ethernet, vlan, arp, gre, mpls, pppoe, tcp, udp, l2tp, ppp, pptp, gtp
#名称不区别大小写,  name is case insensitive, ipv4 is euqal to IPV4
# []表示某个层的index, 从最外层ethernet开始, 从0开始计数, *表示不关心具体在哪层,只要地址类型符合即可  
# prune_layer_name: 表示哪一层协议是发包时需要跳过的, 

vlan[*]
mpls[*]
gtp[*]
