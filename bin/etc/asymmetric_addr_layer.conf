#用于指定哪些协议层, C2S, S2C两侧层数是一样的, 但地址值不一样, 常见的如mpls, gre, gtp等, 
#需要保存双向地址, 开启本配置的情况下, 单向流反向发包是失败的!
#如果不开启本配置, 单向流反向发包复用对端地址, 可以正常注入包, 但实际有可能不对!
#layer name definition:  ipv4, ipv6, ethernet,vlan, arp, gre, mpls, pppoe, tcp, udp, l2tp, ppp, pptp, gtp
#名称不区别大小写,  name is case insensitive, ipv4 is euqal to IPV4
#
# asymmetric_addr_name: 表示哪一层协议地址是非对称的, 需要保存两侧的地址
# []表示某个层的index, 从最外层ethernet开始, 从0开始计数,  *表示不关心具体在哪层,只要地址类型符合即可  
#asymmetric_layer_name [layer index]

ethernet[0]
ethernet[1]
vlan[*]
mpls[*]
gre[*]
gtp[*]
