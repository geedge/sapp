#用于指定哪些协议层作为地址参数, 用于唯一确定一个流,
#ipv4,ipv6,tcp,udp是默认必须开启的,平台内置!
#其他隧道类协议根据需求, 可自行配置.
#layer name definition:  ethernet,vlan, gre, mpls, pppoe, l2tp, ppp, pptp, gtp
#名称不区别大小写,  name is case insensitive, ipv4 is euqal to IPV4
#
# compare_layer_name: 表示哪一层协议地址是要比较的
# []表示某个层的index, 从最外层ethernet开始, 从0开始计数,  *表示不关心具体在哪层,只要地址类型符合即可  
#pattern: compare_layer_name[layer index]
mpls[*]